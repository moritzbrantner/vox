name: Web Validate

on:
  pull_request:
    paths:
      - .github/workflows/web-validate.yml
      - apps/web/**
      - packages/compute-client/**
      - packages/shared/**
      - package.json
      - bun.lock
      - turbo.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/web-validate.yml
      - apps/web/**
      - packages/compute-client/**
      - packages/shared/**
      - package.json
      - bun.lock
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@40ddfa48b3e68fcde2f055cd5e604f32d944e999
    with:
      tier: standard
      component: apps/web
      strict: true
      install_mode: auto
      report_path: .artifacts/coding-tooling/web-standard.json
      timeout_minutes: 30
