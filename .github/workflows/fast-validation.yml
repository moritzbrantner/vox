name: Fast validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-fast:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: apps/web
            report: web
          - component: apps/server
            report: server
          - component: apps/mobile
            report: mobile
          - component: packages/shared
            report: shared
          - component: packages/compute-client
            report: compute-client
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@40ddfa48b3e68fcde2f055cd5e604f32d944e999
    with:
      tier: fast
      component: ${{ matrix.component }}
      strict: true
      install_mode: auto
      report_path: .artifacts/coding-tooling/${{ matrix.report }}-fast.json
      timeout_minutes: 30

  fast-gate:
    name: Fast gate
    needs: package-fast
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the complete fast matrix
        env:
          MATRIX_RESULT: ${{ needs.package-fast.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Fast validation matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi
