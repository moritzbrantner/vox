[package]
name = "stutter-tracker"
version = "0.1.0"
description = "Speech fluency tracker for recording, voice matching, transcription, and stutter analysis."
authors = ["Moritz Brantner"]
edition = "2021"
default-run = "stutter-tracker"

[lib]
name = "stutter_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The benchmark binary includes stutter_bench.rs, whose tests already run in the library harness.
[[bin]]
name = "stutter-eval"
path = "src/bin/stutter-eval.rs"
test = false

# The ASR challenge-set runner includes asr_bench.rs, whose tests run in the library harness.
[[bin]]
name = "asr-eval"
path = "src/bin/asr-eval.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Registry coordinates remain the distribution contract. Ordinary development
# activates the exact capability source graph from the repository root.
audio-analysis-core = { package = "moenarch-audio-analysis-core", version = "=0.1.0" }
audio-analysis-fourier = { package = "moenarch-audio-analysis-fourier", version = "=0.1.0" }
audio-analysis-pitch = { package = "moenarch-audio-analysis-pitch", version = "=0.1.0" }
audio-analysis-recognition = { package = "moenarch-audio-analysis-recognition", version = "=0.1.0" }
audio-analysis-rhythm = { package = "moenarch-audio-analysis-rhythm", version = "=0.1.0" }
audio-analysis-speakers = { package = "moenarch-audio-analysis-speakers", version = "=0.1.4" }
audio-analysis-transcription = { package = "moenarch-audio-analysis-transcription", version = "=0.1.15", features = ["native"] }
hound = "3.5"
media-core = { package = "moenarch-media-core", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
# Historical text-analysis package surfaces now map to their extracted owners.
text-analysis-core = { package = "moenarch-text-core", version = "=0.1.1" }
text-analysis-corpus = { package = "moenarch-text-lexical", version = "=0.1.1" }
text-analysis-linguistics = { package = "moenarch-text-linguistics", version = "=0.1.1" }
text-analysis-prediction = { package = "moenarch-text-generation", version = "=0.1.1" }
text-transcripts = { package = "moenarch-text-transcripts", version = "=0.1.3" }
thiserror = "2"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
approx = "=0.5.1"
